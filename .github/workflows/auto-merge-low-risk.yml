# Turns on GitHub auto-merge for PRs that CodeRabbit has reviewed and that touch no high-risk path.
# GitHub then merges the PR only when every branch-protection requirement is met
# (CodeRabbit approval counts as the required review, CI is green, no CODEOWNERS review is pending).
# Needs: repo setting "Allow auto-merge" ON, and branch protection on main with 1 required approval,
# required status checks (CI plus "CodeRabbit"), and "Require review from Code Owners".
name: auto-merge-low-risk

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Check changed paths
        id: risk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # Include the OLD path of renames (previous_filename), or moving a file out of auth/ looks harmless.
          # Fail closed: an API error, an empty list, or a huge PR (the API stops listing at 3000 files) counts as high risk.
          if ! files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)'); then
            echo "high=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "$files"
          if [ -z "$files" ] || [ "$(echo "$files" | wc -l)" -ge 3000 ]; then
            echo "high=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # (^|/) so a top-level auth/ folder matches too, not only app/auth/. Case-insensitive. Keep in sync with CODEOWNERS.
          HIGH='(^|/)(infra|terraform|migrations|migration|auth|authn|authz|billing|payments|secrets|\.github|\.claude)/|^(\.coderabbit\.yaml|claude\.md|codeowners|docs/codeowners)$|(^|/)(\.env[^/]*|[^/]*\.tf|[^/]*\.tfvars|[^/]*\.pem|[^/]*\.key)$'
          if echo "$files" | grep -E -i -q "$HIGH"; then
            echo "high=true" >> "$GITHUB_OUTPUT"
          else
            echo "high=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Enable auto-merge (squash) for low-risk PRs
        if: steps.risk.outputs.high == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
      - name: Label high-risk PRs
        if: steps.risk.outputs.high == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          # A later push can turn a low-risk PR high-risk: cancel any auto-merge enabled earlier.
          gh pr merge --disable-auto "$PR_URL" || true
          gh pr edit "$PR_URL" --add-label "needs-human-review"
