# Minimal CI so branch protection has a required check. Replace the test step with yours.
# `python -m pytest`, not bare `pytest`: it puts the repo root on sys.path so `import app` works.
name: ci
on:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest && python -m pytest -q
